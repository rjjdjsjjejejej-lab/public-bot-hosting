{% extends "base.html" %}{% block content %}<div class="card" style="max-width:440px;margin:8vh auto"><h1>Create account</h1><p class="muted">Choose a username and a strong password.</p><form method="post"><label>Username</label><input name="username" required minlength="3" maxlength="32" autocomplete="username" style="width:100%"><label>Password (12+ characters)</label><input type="password" name="password" required minlength="12" autocomplete="new-password" style="width:100%"><p><button style="width:100%">Register</button></p></form><p>Already registered? <a href="{{ url_for('login') }}" style="color:#9faeff">Login</a></p></div>{% endblock %}
