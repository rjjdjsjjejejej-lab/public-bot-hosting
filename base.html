<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BotCloud Panel</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8ecf7;font:15px system-ui,Arial}.wrap{max-width:1050px;margin:28px auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:27px;margin:0 0 6px}h2{font-size:18px;margin-top:0}.muted{color:#a6b0ca}.card{background:#141b30;border:1px solid #283450;border-radius:14px;padding:18px;margin:16px 0}
input,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #34415f}input{background:#0c1326;color:#fff;max-width:100%}button,.btn{background:#5267e8;color:white;border:0;cursor:pointer;text-decoration:none;display:inline-block;padding:9px 12px;border-radius:8px}.stop{background:#bd4057}.secondary{background:#293653}.danger{background:#8d2e40}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bot{border-top:1px solid #293653;padding:14px 0}.badge{font-size:12px;border-radius:20px;padding:4px 8px;background:#233d35;color:#9ff0c9}.off{background:#402b35;color:#ffb9c5}.flash{padding:10px 12px;border-radius:8px;margin:10px 0;background:#26385c}.error{background:#5a2735}.success{background:#1c4739}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080d19;padding:14px;border-radius:8px;max-height:65vh;overflow:auto}label{display:block;margin:8px 0 4px}small{display:block;margin-top:10px;line-height:1.5}
</style></head><body><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
